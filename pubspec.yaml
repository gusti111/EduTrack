name: edutrack
description: EduTrack — Smart Student Planner (PjBL Project)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Backend
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.4
  # Dipakai auth_service.dart khusus untuk Google Sign-In di Android/iOS
  # (lewat signInWithCredential). Di Web, Google Sign-In pakai
  # FirebaseAuth.signInWithPopup langsung — tidak butuh package ini —
  # jadi tidak perlu konfigurasi client ID tambahan di web/index.html.
  google_sign_in: ^6.2.2
  # MIGRASI: cloud_firestore (gRPC/WebChannel) sudah tidak dipakai —
  # semua operasi data Firestore sekarang lewat REST API biasa (`http`)
  # via FirestoreRestClient. Lihat lib/core/network/firestore_rest_client.dart.
  http: ^1.2.2

  # State management
  provider: ^6.1.2

  # Utilities
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.2.3
  table_calendar: ^3.1.2
  firebase_messaging: ^15.2.10
  cloud_firestore: ^5.6.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/env.txt
    - assets/icons/
    - assets/illustrations/
