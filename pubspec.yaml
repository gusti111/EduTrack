name: edutrack
description: EduTrack — Smart Student Planner (PjBL Project)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Backend
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.4

  # State management
  provider: ^6.1.2

  # Utilities
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.2.3
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - assets/illustrations/
